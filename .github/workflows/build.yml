name: Build Quaize Bot APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential git zip unzip openjdk-17-jdk-headless \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev
            
        timeout-minutes: 15
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Create .env from secret
        run: |
          echo "GIGACHAT_AUTH_KEY=${{ secrets.GIGACHAT_AUTH_KEY }}" > .env

      - name: Patch libffi autoconf issue
        run: |
          mkdir -p ~/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/libffi/
          cat > ~/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/libffi/fix_autoconf.patch << 'EOF'
          --- a/configure.ac
          +++ b/configure.ac
          @@ -1,3 +1,4 @@
          +m4_pattern_allow([LT_SYS_SYMBOL_USCORE])
           AC_INIT([libffi], [3.3], [http://github.com/libffi/libffi/issues])
           EOF

      - name: Build APK with Buildozer
        run: |
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          buildozer -v android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quaize-bot-apk
          path: bin/*.apk
